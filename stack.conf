# Manifest for the whole-stack deploy. Sourced by bootstrap.sh and deploy.sh.
# Plain shell; no secrets and nothing executable.
#
# The public surface -- DNS names, NPM hosts, MCP prefixes, onion services, the
# status page -- is NOT here: it is declared once in deploy/services.toml and
# re-emitted under the old shell names by scripts/lib.sh's load_manifest. This
# file keeps what is not part of that surface: paths, the backup set, runes,
# retention, images, firewall ports and the app-tier knobs. What each one is for,
# and what breaks if you change it, is docs/units.md, "The knobs in stack.conf".

# GitHub owner whose repos make up the stack.
GITHUB_ORG="${GITHUB_ORG:-regularnmae}"

# Where the sibling repos are cloned and built.
BUILD_DIR="${BUILD_DIR:-$HOME/build}"

# Everything the stack must not lose. Empty makes deploy.sh ask once (default
# $HOME/data) and remember the answer, so point it at a separate disk to survive
# an OS reinstall. See README, "Where the data lives".
STACK_DATA_DIR="${STACK_DATA_DIR:-}"

# Where that answer is remembered. On the root filesystem, so it does not depend
# on the data disk.
STACK_DATA_ENV="${STACK_DATA_ENV:-${XDG_CONFIG_HOME:-$HOME/.config}/stack/data-dir.env}"

# The restic repository's default host directory, outside $STACK_DATA_DIR so a
# wiped data dir does not take the backups with it. Same-disk survives deletion,
# not the disk.
STACK_BACKUP_DIR="${STACK_BACKUP_DIR:-$HOME/data-backup}"

# How long restic keeps snapshots, as `restic forget` takes it. The ONE
# declaration: install.sh renders it into backup.container's Exec= and
# backup.sh uses it for a hand run and for `forget`.
BACKUP_RETENTION=(--keep-daily 7 --keep-weekly 4 --keep-monthly 6)

# The backup set: directories under $DATA_DIR whose state cannot be
# re-downloaded. ONE declaration -- install.sh renders the Volume= lines and
# Exec=, backup.sh derives its mounts, restore directories and prompt from it, so
# adding a directory is a one-line edit. Each entry mirrors to /data/<name> in the
# container; what each holds is README's "Backup & restore".
BACKUP_PATHS=(
    cln
    btcpay
    tor
    config
    npm
    audit
    uptime-kuma
    postgres-dump
    npm-dump
    uptime-kuma-dump
)

# What restic must not take out of those directories: the live databases, which
# come back as dumps instead. Three reasons, in order:
#   audit/auditd.fim           root-owned, unreadable to the backup container;
#                              restic exits 3 and skips `forget`, so retention
#                              stops silently.
#   npm/data/database.sqlite*  live SQLite (with -journal/-wal/-shm). Copy:
#                              npm-dump/.
#   uptime-kuma/mariadb        live embedded MariaDB. Copy: uptime-kuma-dump/.
# uptime-kuma/run and uptime-kuma/kuma.db are transient leftovers.
BACKUP_EXCLUDES=(
    audit/auditd.fim
    npm/data/database.sqlite*
    uptime-kuma/mariadb
    uptime-kuma/run
    uptime-kuma/kuma.db
)

# The drill's extra assertions (backup.sh verify): "the directory came back but
# the thing that matters is missing". Every BACKUP_PATHS entry is already
# required non-empty, so a new entry needs nothing here. Relative to $DATA_DIR.
BACKUP_VERIFY_PATHS=(
    cln/bitcoin/hsm_secret
    btcpay/Plugins/BTCPayServer.Plugins.Monero/BTCPayServer.Plugins.Monero.dll
    tor/onion
    config/stack/secrets.env
    npm-dump/database.sqlite
    uptime-kuma-dump/kuma.sql
    postgres-dump/all.sql
)

# Application repos, built and deployed in this order by deploy.sh. Their units
# live here, not in the app repos. The order is load-bearing: each server reads
# something the step above it brings up, so a server whose upstream is missing on
# first boot is retried by ./configure.sh rather than ordering the whole deploy
# around it.
APP_REPOS=(
    searxng-mcp
    bitcoin-node-mcp
    monero-node-mcp
    monero-wallet-mcp
    lightning-mcp
    fulcrum-mcp
    victoria-logs-mcp
    victoriametrics-mcp
    crowdsec-mcp
    btcpay-mcp
)

# ---------------------------------------------------------------------------
# BoltMesh: the application tier (postgres + backend + worker + frontend)
# ---------------------------------------------------------------------------
# A second GitHub org, private, cloned over SSH: the host must authenticate to
# GitHub as a user with access (`ssh -T git@github.com`). Pairs are
# "repo name:local build dir"; the local dir is namespaced because the upstream
# names are generic. Built separately from APP_REPOS: they need a build target
# and VITE_* arguments the generic path does not pass.
GITHUB_ORG_BOLTMESH="${GITHUB_ORG_BOLTMESH:-boltmesh-labs}"
GITHUB_SSH_HOST="${GITHUB_SSH_HOST:-git@github.com}"
BOLTMESH_REPOS=(
    "backend:boltmesh-backend"
    "frontend:boltmesh-frontend"
)

# Shown in the UI and page metadata (baked into the SPA at build time, and seeded
# into app.env as COMPANY_NAME), so changing one means a rebuild.
BOLTMESH_COMPANY_NAME="${BOLTMESH_COMPANY_NAME:-BoltMesh VPN}"
BOLTMESH_SUPPORT_EMAIL="${BOLTMESH_SUPPORT_EMAIL:-support@boltmesh.net}"
# The agent repo the backend deploys nodes from (GITHUB_REPO in app.env).
BOLTMESH_AGENT_REPO="${BOLTMESH_AGENT_REPO:-boltmesh-labs/agent}"

# The agent-skills repo: eleven skills plus `agent-mcp`, for harnesses that do not
# speak MCP. NOT a service, so it must never join APP_REPOS (no Containerfile);
# deploy.sh clones it and runs its install.sh. The only thing a deploy installs
# into $HOME outside $DATA_DIR, hence --skip-agent-skills.
AGENT_SKILLS_REPO="${AGENT_SKILLS_REPO:-agent-skills}"

# The TCP ports opened in firewalld by bootstrap.sh -- the only LAN-reachable
# ones. 80/443/81 is nginx-proxy-manager, on the host network so it binds them
# itself (that is what makes a client's real address reach its logs). 50001/50002
# is Fulcrum: Electrum is raw TCP, so NPM cannot front it. Everything else
# publishes on the host's loopback only, which is where NPM's forwards point.
FIREWALL_PORTS=(80 443 81 50001 50002)

# BTCPay's Monero plugin, pinned to the plugin-builder artifact. install.sh
# verifies the hash and keeps a marker; Renovate cannot track the URL, so a bump
# edits both values.
BTCPAY_PLUGIN_URL="https://btcpaypluginbuilder.blob.core.windows.net/artifacts/monero-plugin/19/BTCPayServer.Plugins.Monero.btcpay"
BTCPAY_PLUGIN_SHA256="3fe30ab008b3eb66445b52861f9453620ab3911ba94242c39019ddb1c6677f03"
BTCPAY_PLUGIN_ID="BTCPayServer.Plugins.Monero"

# Images built from this repo. The tags are versionless on purpose: the pinned
# versions live only in each Containerfile, where Renovate bumps them.
TOR_IMAGE="localhost/tor:local"
NETCHECK_IMAGE="${NETCHECK_IMAGE:-localhost/netcheck:local}"
BTC_EXPLORER_IMAGE="${BTC_EXPLORER_IMAGE:-localhost/btc-explorer:local}"
XMR_EXPLORER_IMAGE="${XMR_EXPLORER_IMAGE:-localhost/xmr-explorer:local}"

# ---------------------------------------------------------------------------
# Healthchecks: the one exception list
# ---------------------------------------------------------------------------
# Every container unit defines a HealthCmd; this is the complete set that cannot,
# and why (scripts/healthcheck-lint.sh enforces it in both directions). Type=oneshot
# jobs need no entry: their exit status is the health signal.
HEALTHLESS_UNITS=(
    "victoria-logs|distroless image: no shell, so podman cannot run a health command"
    "netcheck|sleeper; the probe is its caller (net_curl)"
    "netcheck-host|same image on the host network; the probe is its caller"
)

# ---------------------------------------------------------------------------
# Durable units: the ones that must be stopped, never SIGKILLed
# ---------------------------------------------------------------------------
# Each declares StopTimeout= and TimeoutStopSec= with 30s of headroom (HC010). The
# test is whether a SIGKILL mid-write costs a rebuild or a resync, not whether the
# unit writes at all: the metrics history and the explorers' data are outside it.
STATEFUL_UNITS=(
    bitcoind
    fulcrum
    monerod
    postgres
    btcpay
    nbxplorer
    lightningd
)

# ---------------------------------------------------------------------------
# The daemon tier: what `deploy.sh --skip-daemons` leaves out
# ---------------------------------------------------------------------------
# The one list both that flag and `verify.sh --no-nodes` read, so a skipped unit
# is not reported missing. A policy list, not an inventory (that is deploy/).
CHAIN_UNITS=(
    bitcoind
    monerod
    fulcrum
    lightningd
    btcpay
    nbxplorer
    monero-wallet-btcpay
    btc-explorer
    xmr-explorer
)

# ---------------------------------------------------------------------------
# Core Lightning runes: the method allowlists, declared once
# ---------------------------------------------------------------------------
# install.sh mints these and rotate.sh re-mints them, so the runes a rotation
# hands out are exactly the ones a fresh install would. Each entry is a method
# prefix; rune_json turns the arrays into the restriction JSON. getinfo is in
# every set so checkrune can prove a rune before anything is written.
CLN_READ_METHODS=(getinfo listfunds listchannels listpeers listinvoices listpays decode)
CLN_SPEND_METHODS=(invoice pay keysend withdraw close)

# How much history to keep: a postmortem aid, not an archive. The store is
# regenerable and stays out of the backup set. Rendered into the unit's Exec=.
METRICS_RETENTION="${METRICS_RETENTION:-30d}"

# Logs: time-based retention, and a second independent bound so a crash-loop that
# writes megabytes a second cannot fill the data disk (VictoriaLogs always keeps
# the two most recent days). Rendered into victoria-logs.container. Regenerable.
LOGS_RETENTION="${LOGS_RETENTION:-14d}"
LOGS_MAX_BYTES="${LOGS_MAX_BYTES:-10GiB}"

# Daily rotations of Suricata's EVE files kept by the host's logrotate, through
# deploy/root/logrotate-stack-ids. Suricata cannot rotate a static name, and the
# stable names are what vector, ids.sh and CrowdSec follow.
IDS_RETENTION_DAYS="${IDS_RETENTION_DAYS:-14}"

# The host's PUBLIC address -- the router's, not one this host holds -- as
# nginx-proxy-manager logs it. A LAN client using a public name arrives as it
# through NAT loopback, and stack/http-authfail bans five 401s in ten seconds;
# bouncer.sh refuses to ENFORCE a ban on this address, while still raising and
# paging the decision. A declaration, not a lookup: resolving $MCP_HOST would
# follow a CDN. ./verify.sh warns when it disagrees with what NPM logs.
STACK_WAN_IP="${STACK_WAN_IP:-93.177.140.197}"
