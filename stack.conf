# Manifest for the whole-stack deploy. Sourced by bootstrap.sh and deploy.sh.
# Plain shell; no secrets and nothing executable.
#
# The public surface -- the DNS names, the nginx-proxy-manager hosts, the MCP
# path prefixes, the tor onion services and the status page's monitors -- is
# NOT here: it is declared once in deploy/services.toml, read by the Python
# reconcilers directly and re-emitted under the old shell names (MCP_HOSTS,
# ONION_SERVICES, *_HOST) through scripts/lib.sh's load_manifest for the bash
# callers. This file keeps what is not part of that surface: paths, the backup
# set, runes, retention, images, firewall ports and the app-tier knobs.
#
# This repo (stack) owns every unit (daemons, nginx-proxy-manager, the shared
# network and the ten MCP servers) and the orchestration. Each application repo
# under APP_REPOS ships only its code, tests, CI and Containerfile.

# GitHub owner whose repos make up the stack.
GITHUB_ORG="${GITHUB_ORG:-regularnmae}"

# Where the sibling repos are cloned and built.
BUILD_DIR="${BUILD_DIR:-$HOME/build}"

# Where the stack keeps everything it must not lose: the daemon data dirs, the
# nginx-proxy-manager data, and the config/secrets. Leaving it empty makes
# deploy.sh ask once (default $HOME/data) and remember the answer; set it here
# or in the environment to skip the prompt. Point it at a separate disk to
# survive an OS reinstall.
STACK_DATA_DIR="${STACK_DATA_DIR:-}"

# Where the chosen data dir is remembered. This pointer lives on the root
# filesystem (it is tiny), so it does not depend on the data disk.
STACK_DATA_ENV="${STACK_DATA_ENV:-${XDG_CONFIG_HOME:-$HOME/.config}/stack/data-dir.env}"

# Where the backup job (deploy/backup.container) keeps its restic repository by
# default, mounted into the container at /repo. It is deliberately OUTSIDE
# $STACK_DATA_DIR so a wiped data dir does not take the backups with it. A
# same-disk repo survives accidental deletion and corruption but NOT the disk
# itself: for real disaster recovery set RESTIC_REPOSITORY in
# $DATA_DIR/config/backup/backup.env to an offsite target (s3:, b2:, sftp:).
STACK_BACKUP_DIR="${STACK_BACKUP_DIR:-$HOME/data-backup}"

# How long restic keeps snapshots, as the flags `restic forget` takes. This is
# the ONE declaration: deploy/install.sh renders it into deploy/backup.container's
# Exec= and scripts/backup.sh uses it for a hand run and for `forget`, so the
# nightly job and a manual prune apply the same policy.
BACKUP_RETENTION=(--keep-daily 7 --keep-weekly 4 --keep-monthly 6)

# The backup set: the directories under $DATA_DIR that hold state which cannot be
# re-downloaded. This array is the ONE declaration -- deploy/install.sh renders it
# into deploy/backup.container (one read-only Volume= per entry, plus the restic
# path list in its Exec=) and scripts/backup.sh derives its own mounts, its restic
# arguments, the directories a restore must recreate and its confirmation prompt
# from it. Adding a directory is a one-line edit here; nothing else lists them.
#
# Names only: each entry is $DATA_DIR/<name> on the host and /data/<name> in the
# container. That mirroring is what lets a restore target "/" and land the
# contents straight back in the data dir.
#
#   cln/                the CLN identity, channel state and hsm_secret
#   btcpay/             BTCPay's data-protection keys, the pinned Monero plugin
#                       and xmr-wallet/ (the plugin's VIEW-ONLY wallet: address
#                       and view key, no spend key)
#   tor/                torrc plus tor/onion/, the hidden services' keys -- a
#                       lost key is a new .onion address
#   config/             every token, rune, password and env file
#   npm/                nginx-proxy-manager config and TLS material
#   audit/              the monitor's log and the spend tripwire baselines
#   uptime-kuma/        the status page's own state (UI-configured)
#   postgres-dump/      the BoltMesh database as a pg_dumpall (all.sql), written
#                       by deploy/postgres-dump.container just before each run.
#                       The raw postgres/ cluster is deliberately absent: a
#                       file-by-file copy of a live PGDATA is only
#                       crash-recoverable.
#   npm-dump/           NPM's SQLite database, copied through SQLite's online
#                       backup API by scripts/db-dump.sh just before each run
#                       (see BACKUP_EXCLUDES for why the live file is not here).
#   uptime-kuma-dump/   the status page's database as a mariadb-dump, taken with
#                       --single-transaction by the same script. uptime-kuma v2
#                       runs an EMBEDDED MARIADB, not sqlite: the live datadir is
#                       a warm InnoDB tree and is excluded (see below).
#
# The three dumps are the same rule applied to every live database: a
# file-by-file copy of something a daemon is writing is only crash-recoverable,
# and restic reads each file at its own instant, so even a "crash-consistent"
# pair can disagree. They are taken immediately before the restic run by
# postgres-dump.service and db-dump.service (backup.container Wants=/After=
# both), and a failed dump leaves the previous one in place rather than
# blocking the backup.
#
# Deliberately NOT here (large and/or regenerable, so restic never walks them):
# bitcoin/ monero/ (the chains), fulcrum/ (the Electrum index), searxng/,
# monitoring/ (the metrics store), logs/ (the log store and its shipper's
# checkpoint), ids/ (Suricata's EVE log and CrowdSec's decision DB -- both
# regenerable telemetry, eve.json alone at ~50 MB/day), backup-cache/,
# backup-verify/ (the restore drill's scratch target) and postgres/ itself.
BACKUP_PATHS=(
    cln
    btcpay
    tor
    config
    npm
    audit
    uptime-kuma
    postgres-dump
    npm-dump
    uptime-kuma-dump
)

# What restic must NOT take out of the directories above, relative to $DATA_DIR
# (rendered as --exclude=/data/<entry>). This is where the live databases live,
# and it is the same reasoning as the raw postgres/ cluster: the snapshot keeps
# a consistent dump, never a warm file tree. Each entry names who holds the
# consistent copy instead.
#
#   audit/auditd.fim              root-owned FIM baseline written by the rootful
#                                 IDS; the container cannot read it (SELinux
#                                 initrc_tmp_t) and restic exits 3 ("some source
#                                 data could not be read") yet still saves the
#                                 snapshot -- which skips `restic forget`, so
#                                 retention stops silently.
#   npm/data/database.sqlite*     NPM's live SQLite db (and any -journal/-wal/
#                                 -shm beside it). Consistent copy: npm-dump/.
#   uptime-kuma/mariadb           kuma's live embedded-MariaDB datadir (InnoDB
#                                 ibdata1/ib_logfile0 plus Aria). Consistent
#                                 copy: uptime-kuma-dump/kuma.sql.
#   uptime-kuma/run               the mariadbd socket and pid file: transient,
#                                 and a socket is not restorable state.
#   uptime-kuma/kuma.db           a 0-byte leftover from before kuma v2 used the
#                                 embedded MariaDB; nothing writes it.
BACKUP_EXCLUDES=(
    audit/auditd.fim
    npm/data/database.sqlite*
    uptime-kuma/mariadb
    uptime-kuma/run
    uptime-kuma/kuma.db
)

# The restore drill's extra assertions (scripts/backup.sh verify, run weekly by
# backup-verify.timer). The drill already requires every BACKUP_PATHS entry above
# to be present and non-empty, so a new entry needs nothing here: these are the
# "the directory came back but the thing that matters is missing" markers -- an
# empty config/, a cln/ without the seed. Paths are relative to $DATA_DIR (the
# snapshot's /data), and a directory marker must hold at least one file.
#
# The three database markers name the DUMPS, not the live files: the live ones
# are in BACKUP_EXCLUDES. The drill goes further than "present and non-empty" for
# them -- it checks the two SQL dumps' completion trailers and runs PRAGMA
# quick_check on the restored SQLite copy -- because presence was exactly the
# check that could not tell a consistent dump from a torn file tree.
#
# The plugin DLL proves the BTCPay datadir came back with the Monero plugin;
# the wallet itself lives under btcpay/xmr-wallet and needs the operator's view
# key to be re-imported, so it is not a drill marker until it exists.
BACKUP_VERIFY_PATHS=(
    cln/bitcoin/hsm_secret
    btcpay/Plugins/BTCPayServer.Plugins.Monero/BTCPayServer.Plugins.Monero.dll
    tor/onion
    config/stack/secrets.env
    npm-dump/database.sqlite
    uptime-kuma-dump/kuma.sql
    postgres-dump/all.sql
)

# Application repos, built and deployed in this order by deploy.sh. Their units
# live here, not in the app repos. Order is load-bearing:
#   searxng-mcp      reads searxng/valkey, which start_infra brings up first
#   bitcoin-node-mcp reads its RPC credentials from the running bitcoind
#   monero-node-mcp  read-only, no ordering constraint beyond monerod up
#   monero-wallet-mcp reads the view-only BTCPay wallet, so after that wallet exists
#   lightning-mcp    reads the runes install.sh mints once lightningd answers
#                    (./configure.sh waits, re-runs the installer and restarts
#                    the server when the rune file changed)
#   fulcrum-mcp      reads the Fulcrum index, which start_infra brings up first
#   victoria-logs-mcp reads the log store, which start_infra brings up first
#   victoriametrics-mcp reads the metrics store, also brought up by start_infra
#   crowdsec-mcp     reads the LAPI, which start_infra brings up first. The one
#                    MCP server that is NOT on npm-network -- see MCP_HOSTS
#   btcpay-mcp       reads BTCPay, which start_btcpay starts before deploy_apps;
#                    its read-only API key and upstream env are written by
#                    ./configure.sh, which then restarts the server
APP_REPOS=(
    searxng-mcp
    bitcoin-node-mcp
    monero-node-mcp
    monero-wallet-mcp
    lightning-mcp
    fulcrum-mcp
    victoria-logs-mcp
    victoriametrics-mcp
    crowdsec-mcp
    btcpay-mcp
)

# ---------------------------------------------------------------------------
# BoltMesh: the application tier (postgres + backend + worker + frontend)
# ---------------------------------------------------------------------------
# A second GitHub org, because these repos are not under $GITHUB_ORG. Pairs are
# "GitHub repo name:local build dir" -- the local dir is namespaced because the
# upstream names (backend, frontend) are generic. deploy.sh builds them
# separately from APP_REPOS: they ship a Containerfile but need extra build
# arguments and a build target the generic app path does not pass.
#
# Unlike $GITHUB_ORG (public, cloned over HTTPS), the boltmesh-labs repos are
# PRIVATE, so they are cloned over SSH: the host must already authenticate to
# GitHub as a user with access (`ssh -T git@github.com` must greet you). Set
# GITHUB_SSH_HOST to an ~/.ssh/config alias if git@github.com is not the key's
# host. deploy.sh never lets git prompt -- a missing key is a setup error.
GITHUB_ORG_BOLTMESH="${GITHUB_ORG_BOLTMESH:-boltmesh-labs}"
GITHUB_SSH_HOST="${GITHUB_SSH_HOST:-git@github.com}"
BOLTMESH_REPOS=(
    "backend:boltmesh-backend"
    "frontend:boltmesh-frontend"
)

# BoltMesh's public hostnames and the NPM hosts that serve them live in
# deploy/services.toml ([host.frontend], [host.api], [npm.*]); frontend is
# baked into the SPA at build time (VITE_API_URL), so changing it means
# re-running ./deploy.sh, which rebuilds the frontend image.
# Shown in the UI and page metadata (VITE_APP_* build args; also seeded into
# app.env as COMPANY_NAME).
BOLTMESH_COMPANY_NAME="${BOLTMESH_COMPANY_NAME:-BoltMesh VPN}"
BOLTMESH_SUPPORT_EMAIL="${BOLTMESH_SUPPORT_EMAIL:-support@boltmesh.net}"
# The agent repo the backend deploys nodes from (GITHUB_REPO in app.env).
BOLTMESH_AGENT_REPO="${BOLTMESH_AGENT_REPO:-boltmesh-labs/agent}"

# The ten MCP servers' path prefixes, containers and loopback publishes are
# the [mcp.*] tables in deploy/services.toml; [host.mcp] carries the one TLS
# hostname they are served under (https://$MCP_HOST/<prefix>). The bash
# callers get MCP_HOST/MCP_HOSTS back through load_manifest.


# The agent-skills repo: eleven skills plus `agent-mcp`, a stdlib-only client, for
# agent harnesses that do not speak MCP (Codex, a plain shell, CI). It is NOT a
# service and must never join APP_REPOS: it ships no Containerfile and starts no
# container, so deploy_app would bail on it. deploy.sh clones it into
# $BUILD_DIR/agent-skills and runs its install.sh, which links the skills into
# the harnesses that exist (~/.config/opencode, ~/.codex, ~/.claude) and puts
# agent-mcp in ~/.local/bin.
#
# Its servers.json expands $AGENT_MCP_BASE_URL (default mcp.boltmesh.net, the
# default [host.mcp] in deploy/services.toml) and reads each server's token
# straight out of
# $DATA_DIR/config/<server>/token.env on every call -- never a copy -- so a
# rotated token needs no second edit here.
# The path prefixes are in that registry, not derived, so moving a prefix in
# deploy/services.toml means updating servers.json too; verify.sh fails on the
# drift.
#
# This is the only thing a deploy installs into $HOME outside $DATA_DIR, which
# is why it has --skip-agent-skills. Public repo, so it clones over HTTPS.
AGENT_SKILLS_REPO="${AGENT_SKILLS_REPO:-agent-skills}"

# ---------------------------------------------------------------------------
# Tor onion services
# ---------------------------------------------------------------------------
# Declared in deploy/services.toml's [onion.*] tables, rendered into a marked
# block of $DATA_DIR/tor/torrc by deploy/install.sh and probed by verify.sh
# (ONION_SERVICES is re-emitted by load_manifest). The reasoning -- pinned
# container IPs because tor validates the target at startup, the mcp entry's
# host.containers.internal, no TLS on the onion side -- lives with the tables
# there.


# TCP ports opened in firewalld by bootstrap.sh. These are the only ports
# reachable on the LAN:
#   80/443/81        nginx-proxy-manager (HTTP, HTTPS, admin UI), on the host
#                    network, so it binds them itself in the host's namespace.
#                    That is what makes a client's real address reach its logs
#                    and the X-Forwarded-For it sets.
#   50001/50002      Fulcrum, the Electrum server (plaintext / self-signed TLS).
#                    The Electrum protocol is raw TCP, not HTTP, so NPM cannot
#                    front it -- the one deliberate non-NPM LAN surface.
# Every other service publishes its port on the host's loopback only
# (PublishPort=127.0.0.1:... in deploy/), which is where NPM's forwards above
# point: a loopback bind is not LAN-reachable, so those ports are NOT opened
# here. The host-side scripts read those services by container name on
# npm-network, through scripts/lib.sh's net_curl.
FIREWALL_PORTS=(80 443 81 50001 50002)

# BTCPay's Monero plugin, pinned to the official plugin-builder artifact for
# BTCPay 2.x. install.sh verifies this hash and extracts it into
# $DATA_DIR/btcpay/Plugins, keeping a marker of the artifact it installed; it
# re-downloads when that marker no longer matches this hash, and deploy.sh
# restarts btcpay when the plugin on disk is newer than the running container.
# Renovate cannot track a plugin-builder URL, so a bump is a deliberate edit of
# both the version and the hash.
BTCPAY_PLUGIN_URL="https://btcpaypluginbuilder.blob.core.windows.net/artifacts/monero-plugin/19/BTCPayServer.Plugins.Monero.btcpay"
BTCPAY_PLUGIN_SHA256="3fe30ab008b3eb66445b52861f9453620ab3911ba94242c39019ddb1c6677f03"
BTCPAY_PLUGIN_ID="BTCPayServer.Plugins.Monero"

# The tor image is built from this repo's tor/Containerfile; it is not pulled.
# The tag is versionless on purpose: the tor/alpine versions live only in
# tor/Containerfile (Renovate bumps them there).
TOR_IMAGE="localhost/tor:local"

# The netcheck image (a curl client on npm-network, built from
# netcheck/Containerfile) is built by deploy/install.sh the same way, and used
# by scripts/lib.sh's net_curl. Same versionless-tag reasoning as tor.
NETCHECK_IMAGE="${NETCHECK_IMAGE:-localhost/netcheck:local}"

# The two blockchain-explorer images are built from this repo's btc-explorer/
# and xmr-explorer/ Containerfiles (like tor/netcheck), not pulled.
# Versionless tags for the same reason: the pinned versions live only in those
# files. Both are small local builds (MoneroBlock is Go; BTC RPC Explorer is
# Node), so deploy.sh builds each only when it is missing, or when it is named
# with --only. They carry no persistent state: both are stateless and read their
# daemon over RPC, so neither directory is in the backup set.
BTC_EXPLORER_IMAGE="${BTC_EXPLORER_IMAGE:-localhost/btc-explorer:local}"
XMR_EXPLORER_IMAGE="${XMR_EXPLORER_IMAGE:-localhost/xmr-explorer:local}"

# ---------------------------------------------------------------------------
# Healthchecks: the one exception list
# ---------------------------------------------------------------------------
# Every container unit defines a HealthCmd (docs/units.md, "Healthchecks follow a
# contract"); this array is the complete set of units that cannot, and why.
# scripts/healthcheck-lint.sh enforces that a unit is either probed or named
# here (and that a name here has no HealthCmd), and verify.sh reads it instead
# of carrying its own copy -- so adding one is a one-line edit in one place.
#
# Type=oneshot jobs need no entry: their exit status is the health signal, and
# the lint treats them as such.
#
#   victoria-logs    distroless: no shell for podman to run a health command.
#                    verify.sh and monitor.sh query its LogsQL API instead.
#   netcheck         sleeper on npm-network; the probe is its caller (net_curl).
#   netcheck-host    the same image on the host network, same reasoning.
HEALTHLESS_UNITS=(
    "victoria-logs|distroless image: no shell, so podman cannot run a health command"
    "netcheck|sleeper; the probe is its caller (net_curl)"
    "netcheck-host|same image on the host network; the probe is its caller"
)

# ---------------------------------------------------------------------------
# Durable units: the ones that must be stopped, never SIGKILLed
# ---------------------------------------------------------------------------
# A unit whose on-disk database has to be closed cleanly declares
# [Container] StopTimeout= and [Service] TimeoutStopSec= (docs/units.md, "A
# durable unit is stopped, not killed"). Quadlet's stop path has two deadlines:
# podman's default --stop-timeout is 10 s (SIGTERM, then SIGKILL) and systemd's
# DefaultTimeoutStopSec is 90 s for the outer job. Both have to be raised, and
# TimeoutStopSec must exceed StopTimeout by at least 30 s or systemd kills the
# cgroup before podman's own deadline. scripts/healthcheck-lint.sh's HC010
# enforces the pair, the ordering and that every name here is a real template.
#
# Not every unit with a @DATA_DIR@ mount is on the list: the test is whether a
# SIGKILL mid-write costs a rebuild or a resync, not whether the unit writes at
# all. The search cache, the metrics history and the explorers' data are
# outside it; these seven are not. The values live in each unit, from this
# host's measured stops -- monerod is the only one whose full flush has never
# been seen to complete.
STATEFUL_UNITS=(
    bitcoind
    fulcrum
    monerod
    postgres
    btcpay
    nbxplorer
    lightningd
)

# ---------------------------------------------------------------------------
# The daemon tier: what `deploy.sh --skip-daemons` leaves out
# ---------------------------------------------------------------------------
# `verify.sh --no-nodes` must not call a unit missing when the deploy was told to
# skip it, so this is the one list both flags read. Everything here runs a chain,
# indexes one, or settles from one (BTCPay and its view-only wallet), and the two
# explorers read bitcoind, so they are on it too. It is a policy list, not an
# inventory: the inventory is deploy/ itself.
CHAIN_UNITS=(
    bitcoind
    monerod
    fulcrum
    lightningd
    btcpay
    nbxplorer
    monero-wallet-btcpay
    btc-explorer
    xmr-explorer
)

# ---------------------------------------------------------------------------
# Core Lightning runes: the method allowlists, declared once
# ---------------------------------------------------------------------------
# deploy/install.sh mints these and scripts/rotate.sh re-mints them, so they are
# declared here rather than duplicated in both: the runes a rotation hands out
# must be exactly the ones a fresh install would. Each entry is a method prefix
# ("getinfo" matches getinfo and any method starting with it); scripts/lib.sh's
# rune_json turns an array into the restriction JSON `createrune` wants.
#
# READ is the read-only rune lightning-mcp uses for its non-spend tools; SPEND
# is ADDED to it for the payment tools, and the server only uses that rune for
# the spend tools. getinfo is in every set so `checkrune` can prove a freshly
# minted rune before anything is written. BoltMesh no longer uses CLN: BTCPay
# is its settlement engine, so there is no boltmesh rune to mint.
CLN_READ_METHODS=(getinfo listfunds listchannels listpeers listinvoices listpays decode)
CLN_SPEND_METHODS=(invoice pay keysend withdraw close)

# ---------------------------------------------------------------------------
# Monitoring: a metrics store and a host exporter, NOT an alerting path
# ---------------------------------------------------------------------------
# VictoriaMetrics holds the history; node_exporter reads the host (disk space,
# inodes, I/O saturation, memory) and serves the Prometheus textfiles the stack
# writes itself -- scripts/metrics.sh every minute (chain heights, CLN peers, the
# wallet's lag) and scripts/monitor.sh every five (backup age, verify failures,
# spend trips), because neither number comes out of a daemon.
#
# Alerting is a separate tier, and still NOT this store: scripts/monitor.sh
# reads the daemons and the host directly, pushes one alert per check section to
# Alertmanager (deploy/alertmanager.container, loopback :9093), and Alertmanager
# owns grouping, repeat intervals, inhibition, silences and delivery. Nothing on
# the alert path queries VictoriaMetrics, so the store can be down, wedged or
# deleted without silencing an alert -- and an alert needs no query engine to be
# healthy. The dead-man's-switch heartbeat stays in monitor.env for the one
# failure no in-host component can report: the host itself.
#
# Why the split is worth a container: the notification state machine (dedupe,
# hold-down, repeat, silences, "is mail actually leaving?") is exactly what
# Alertmanager already is, and the hand-rolled bash version could not do
# silences, inhibition, repeats, or report its own delivery failures. The one
# piece that stayed in bash is the flap damper, because a push-only producer is
# the only place that knows a check has been bad continuously.
# See README "Metrics and history".
#
# The two image tags are NOT declared here: they are the Image= lines in
# deploy/victoriametrics.container and deploy/node-exporter.container, where
# Renovate's own Quadlet manager follows them (only the three secret-bearing
# templates in deploy/*.container.in need renovate.json's regex manager). Moving
# a tag is therefore a unit change, applied with ./deploy.sh --only <service>.
# METRICS_RETENTION does belong here: install.sh substitutes it into the
# victoriametrics Exec= line.
# How much history to keep. 30 days, not 90: ~1.5k series at a 30s scrape is a
# few hundred MB, and this is a postmortem aid ("how fast was the IBD at 3am,
# when did the Monero RPC wedge?"), not an archive. The store is regenerable, so
# $DATA_DIR/monitoring stays out of the backup set like fulcrum/ and searxng/.
METRICS_RETENTION="${METRICS_RETENTION:-30d}"

# ---------------------------------------------------------------------------
# Logs: journald is the source, VictoriaLogs is the history
# ---------------------------------------------------------------------------
# Every container's output and every host script's journal line is already in
# one place -- podman's default log driver is journald -- so nothing has to
# change in the units to collect them. What was missing is search across
# services, and history: journald was volatile (a 32 MB ring in /run), so a
# reboot erased the record. bootstrap.sh now makes it persistent, and `vector`
# ships it to `victoria-logs`, which keeps it searchable with LogsQL.
#
# These two values are rendered into deploy/victoria-logs.container by
# install.sh (like METRICS_RETENTION into victoriametrics):
#
#   LOGS_RETENTION   time-based retention. 14 days is a debugging window, not an
#                    archive: ~10 MB of text an hour compresses to a few hundred
#                    MB a day in the store.
#   LOGS_MAX_BYTES   a second, independent bound: the store drops the oldest
#                    whole day when it grows past this, so a crash-loop that
#                    writes megabytes a second cannot fill the data disk.
#                    VictoriaLogs always keeps the two most recent days.
#
# The store is regenerable and therefore OUTSIDE the backup set, exactly like
# $DATA_DIR/monitoring: losing it costs the history, nothing else. The shipper's
# checkpoint ($DATA_DIR/logs/vector) is likewise disposable.
LOGS_RETENTION="${LOGS_RETENTION:-14d}"
LOGS_MAX_BYTES="${LOGS_MAX_BYTES:-10GiB}"

# ---------------------------------------------------------------------------
# Intrusion detection: Suricata on the wire, CrowdSec on the logs
# ---------------------------------------------------------------------------
# Two engines because the traffic splits in a way one product cannot cover:
# nginx-proxy-manager terminates TLS, so the wire shows handshakes and scans
# while the request itself exists only in NPM's access log. Suricata (rootful,
# deploy/root/, installed by `sudo ./bootstrap.sh`) watches enp8s0 and lo;
# CrowdSec (rootless, deploy/crowdsec.container) parses the logs into decisions.
#
# Local only, by decision: DISABLE_ONLINE_API=true in deploy/crowdsec.container
# means no console enrolment, no CAPI community blocklist and no telemetry
# leaving the host -- every decision comes from this host's own logs. The cost
# is that a known-bad address is only banned here after it has misbehaved here.
#
# Detection then enforcement: decisions accumulate in the LAPI and
# `stack-bouncer` (deploy/root/bouncer.sh, a root oneshot on a one-minute timer)
# applies them to the `inet stack_bans` nftables set, each element carrying the
# decision's own duration as a timeout. It is the only thing in the stack that
# drops a packet, and it never drops one of yours: private space and every
# address the host holds are refused, at run time.
#
# Everything that must not be banned (the host's own address, which is what the
# onion proxies and Uptime-Kuma's self-checks look like, the podman network and
# the LAN) is in deploy/crowdsec/parsers/s02-enrich/stack-whitelists.yaml.
# Read that file before tightening any scenario: the failure mode is a ban on
# the operator's own monitoring.
#
# There is a second, deliberate exemption in the bouncer itself: STACK_WAN_IP
# below, which is refused at ENFORCEMENT rather than in the whitelist. The
# difference matters -- a whitelisted address produces no decision at all, so a
# real problem on the operator's own egress becomes invisible; a bouncer-level
# refusal keeps the decision, the alert and the history, and only skips the drop.

# Daily rotations of Suricata's EVE files kept by the host's logrotate, through
# deploy/root/logrotate-stack-ids (rendered to /etc/logrotate.d/stack-ids by
# install.sh --root). Suricata cannot rotate a static `filename` -- it needs a
# strftime template -- and the stable names are what vector, scripts/ids.sh and
# CrowdSec follow, so logrotate renames, creates a new file and SIGHUPs the
# sensor to reopen it. At ~50 MB/day of eve.json plus a few hundred KB/day of
# alerts, 14 days is the space this is sized for.
IDS_RETENTION_DAYS="${IDS_RETENTION_DAYS:-14}"

# The host's PUBLIC address -- the router's, not one this host holds -- as
# nginx-proxy-manager logs it. A client that uses a public name from inside the
# LAN goes out to the internet and comes back through the router's NAT loopback
# with this address as its source. Uptime-Kuma used to do that for seven
# monitors every minute; deploy/uptime-kuma.container now resolves every vhost
# but MCP_HOST to the container's host gateway, so the monitoring no longer
# leaves the box and this address is left to LAN browsers using the public name
# and to that one public canary.
#
# It is in no `ip -o addr` output, so stack-bouncer's OWN_IPS cannot see it, and
# the only other thing standing between it and a ban is the `Uptime-Kuma/`
# user-agent entry in the whitelist -- which the agent clients do not send. The
# near miss is on this host's own log: three 401s from one MCP client in one
# second, against stack/http-authfail's bucket of five. Two more would have
# banned the operator's own egress and taken the whole public surface (status
# page included) dark for the decision's four-hour default.
#
# deploy/root/bouncer.sh therefore refuses to ENFORCE a ban on this address. It
# does not exempt it from detection: a stale token that starts retrying still
# raises a decision, still appears in `cscli decisions`, and still pages -- it
# just cannot lock the operator out. That is the difference between this and
# putting the address in the whitelist, which would make the same event
# invisible. Empty disables the refusal.
#
# A declaration, not a lookup, on purpose: resolving $MCP_HOST would follow a
# future CDN in front of the site and exempt one of its edges. ./verify.sh warns
# when this disagrees with the source address NPM logs for the host's own
# monitoring, which is the one way a WAN change (or a CDN) is noticed without
# reading those logs by hand.
STACK_WAN_IP="${STACK_WAN_IP:-93.177.140.197}"

# ---------------------------------------------------------------------------
# Uptime-Kuma (status.boltmesh.net): its monitors, status page and layout are
# authored in kuma's UI -- nothing reconciles them (docs/proxy.md lists the
# checks the public surface expects, and why). Only the page slug is declared,
# in deploy/services.toml's [kuma.page]; load_manifest re-emits it as
# KUMA_STATUS_SLUG for verify.sh. The --add-host rendering into the unit and the
# TCP-port monitor reasoning live in deploy/install.sh and docs/proxy.md.
