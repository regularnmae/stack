name: ci

on:
  push:
    branches: [main]
  pull_request:

# The lint job checks out, curls shellcheck, runs the markdownlint action and
# reads git -- nothing here writes to the repository, so the token the action
# inherits is read-only rather than the repository default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The runner's shellcheck is older and disagrees on some checks (SC2015
      # among them), so a lint that passes locally can fail here for no reason.
      # Pin the version the developer tools carry (see the shellcheck line in
      # AGENTS.md); bump both together.
      SHELLCHECK_VERSION: v0.11.0
    steps:
      # Digest-pinned, not tag-pinned: `helpers:pinGitHubActionDigests` in
      # renovate.json owns this line (the comment carries the tag), because a
      # workflow action runs inside CI with the repo's token and its tag is
      # mutable -- see docs/units.md. A hand bump is
      # `git ls-remote https://github.com/actions/checkout refs/tags/v7`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # -P SCRIPTDIR makes the `# shellcheck source=…` directives resolve
      # relative to each script, and -S info gates on every finding. The file
      # list is enumerated from git rather than written out: a hardcoded list
      # silently skipped four scripts (deploy/btcpay/monero-notify.sh,
      # deploy/root/{audit-report.sh,suricata/start.sh}, scripts/btcpay-wallet.sh)
      # and both scripts/logs.sh and scripts/metrics.sh were missing from one
      # step or the other.
      - name: shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          mapfile -t files < <(git ls-files '*.sh')
          printf 'shellcheck: %d scripts\n' "${#files[@]}"
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x -P SCRIPTDIR -S info \
            "${files[@]}"
      # The healthcheck contract (docs/units.md): explicit keys, a bounded
      # probe, systemd owning the restart. Reads deploy/ templates, so it needs
      # no host.
      - name: healthcheck contract
        run: ./scripts/healthcheck-lint.sh
      # AGENTS.md is the index and docs/ is the detail. The split's one failure
      # mode is silent: rename a doc, or delete one, and the index points at
      # nothing while every other check still passes. So each doc must be named
      # in AGENTS.md and must open with its invariant list (the part that keeps
      # a partial read useful), and every docs/ path named anywhere in the tree
      # must exist.
      - name: docs index agrees with AGENTS.md
        run: |
          mapfile -t docs < <(git ls-files 'docs/*.md')
          [ "${#docs[@]}" -gt 0 ] || { echo "::error::no docs/*.md found"; exit 1; }
          fail=0
          for f in "${docs[@]}"; do
            grep -qF "\`$f\`" AGENTS.md \
              || { echo "::error::$f is not reachable from AGENTS.md"; fail=1; }
            grep -qx '## Invariants' "$f" \
              || { echo "::error::$f has no '## Invariants' list"; fail=1; }
          done
          while IFS= read -r ref; do
            [ -f "$ref" ] || { echo "::error::referenced but missing: $ref"; fail=1; }
          done < <(git grep -hoE 'docs/[a-z0-9-]+\.md' -- ':!docs/' | sort -u)
          [ "$fail" -eq 0 ] || exit 1
          printf 'docs index: %s docs, all reachable from AGENTS.md\n' "${#docs[@]}"
      # The step above proves every docs/ *file* is reachable; this proves every
      # named *section* is. Each doc opens by naming the README sections it
      # defers to, which is a link in prose -- and four of those pointed at
      # headings that had been renamed or never existed. scripts/docs-lint.sh
      # resolves each quoted name against the headings that exist, on both sides
      # of the README/docs split, and joins a reference wrapped across two
      # comment lines first.
      - name: documentation references resolve
        run: ./scripts/docs-lint.sh
      # docs-lint.sh proves cross-references resolve; this proves the files
      # themselves stay well-formed. markdownlint-cli2 merges the action's own
      # default glob (*.{md,markdown}) with the "globs" in
      # .markdownlint-cli2.jsonc, so docs/ is covered by the config; removing
      # them there would silently limit CI to the two root files.
      - name: markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
      # A container unit may mount only from $DATA_DIR (or a podman volume), never
      # from the checkout. Host scripts still run from the checkout (deploy/*.service
      # is the tooling), but a container a daemon starts fails at its *next* start
      # on a moved or deleted repo, with podman naming a missing bind source nobody
      # edited -- which is what monerod's --block-notify helper and the BTCPay
      # bootstrap script used to do. install.sh stages those two into $DATA_DIR/bin;
      # this keeps the next one from sneaking in.
      - name: container units never mount the checkout
        run: |
          mapfile -t files < <(git ls-files 'deploy/*.container' 'deploy/*.container.in' 'deploy/root/*.container')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no container templates found"; exit 1; }
          if hits=$(grep -n '@REPO_DIR@' "${files[@]}"); then
            echo "::error::a container unit references @REPO_DIR@ -- install.sh must stage it under \$DATA_DIR:"
            printf '%s\n' "$hits"
            exit 1
          fi
          printf 'no container template references @REPO_DIR@\n'
      # deploy/env/<app>/<file>.env.in is the shape of every env file install.sh
      # seeds. Two failures are silent until a deploy runs: a template renamed
      # without its call site (install.sh would die mid-install), and a real
      # credential pasted into a committed template -- the rule is a
      # @PLACEHOLDER@, never a value. Both are cheap to catch from the checkout.
      - name: env templates exist and carry no secret
        run: |
          mapfile -t files < <(git ls-files 'deploy/env/*.env.in')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no deploy/env templates found"; exit 1; }
          fail=0
          while IFS= read -r ref; do
            [ -f "$ref" ] || { echo "::error::install.sh references a missing template: $ref"; fail=1; }
          done < <(grep -oE '\$DEPLOY_DIR/env/[A-Za-z0-9_./-]+\.env\.in' deploy/install.sh \
            | sed 's|^\$DEPLOY_DIR/|deploy/|' | sort -u)
          while IFS= read -r rel; do
            [ -f "deploy/env/$rel.in" ] || { echo "::error::SEED_ENV_TEMPLATES names a missing template: deploy/env/$rel.in"; fail=1; }
          done < <(sed -n '/^SEED_ENV_TEMPLATES=(/,/^)/p' deploy/install.sh \
            | grep -oE '"[^"]+\.env"' | tr -d '"')
          if hits=$(grep -nE '^[A-Z_]+=[0-9a-fA-F]{32,}$' "${files[@]}"); then
            echo "::error::a deploy/env template carries a literal secret -- use a @PLACEHOLDER@:"
            printf '%s\n' "$hits"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          printf '%d env templates, all referenced, none carry a secret\n' "${#files[@]}"
      # deploy/install.sh seeds monitor.env from the example, so the file a fresh
      # host gets and the documentation cannot drift. This catches the other
      # direction: a key the stack starts reading that the example never
      # documents (five of them were in that state), which leaves a fresh host
      # unable to discover or tune it from the file its own installer wrote.
      # The read sides are monitor_var (scripts/monitor.sh, read at sweep time)
      # and resolve_monitor_timing (deploy/install.sh, rendered into the vmalert
      # rules) -- the two functions that make this grep complete, because the key
      # is the call's argument and not the tail of an expansion.
      - name: monitor.env documents every key the stack reads
        run: |
          read_keys=$( { grep -oE 'monitor_var MONITOR_[A-Z_]+' scripts/monitor.sh
                         grep -oE 'resolve_monitor_timing MONITOR_[A-Z_]+' deploy/install.sh
                       } | awk '{print $2}' | sort -u )
          declared=$(grep -oE '^MONITOR_[A-Z_]+=' deploy/examples/monitoring/monitor.env.example \
            | tr -d '=' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$read_keys") <(printf '%s\n' "$declared"))
          if [ -n "$missing" ]; then
            echo "::error::deploy/examples/monitoring/monitor.env.example does not document: $(echo "$missing")"
            exit 1
          fi
          printf 'all %s monitor.env keys documented\n' "$(printf '%s\n' "$read_keys" | wc -l)"
      # The sweep turns a finding into a stack_monitor_section series and stops
      # there; the rules are the only thing that makes it a page. A rule missing
      # for one of the two severities is a whole class of checks going silent,
      # and nothing on the host would ever say so.
      - name: the vmalert rules cover every severity the sweep emits
        run: |
          for s in critical warning; do
            grep -q "severity=\"$s\"" deploy/monitoring/rules/stack.yml.in \
              || { echo "::error::deploy/monitoring/rules/stack.yml.in has no rule for severity $s"; exit 1; }
          done
          printf 'the vmalert rules cover every severity the sweep emits\n'
      # The unit generation stamps (scripts/lib.sh) are covered by
      # tests/test-lib.sh, which the workflow runs: a stamp must not change the
      # digest it carries, must land inside [Container], and an unstamped running
      # container must read as drift rather than being adopted.
      - name: syntax check
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            bash -n "$f"
          done
      # The split is deliberate: deploy.sh deploys (units, images, start/
      # restart) and ./configure.sh is the second step, the only place that
      # waits for a service to answer. A health wait creeping back into the
      # deploy turns every redeploy into a slow verification; fail here instead
      # of in review. Comments may name the helpers; only a code line is a call.
      - name: deploy.sh does not wait for health
        run: |
          [ -f deploy.sh ] || { echo "::error::deploy.sh is missing"; exit 1; }
          if grep -nE '^[[:space:]]*[^#[:space:]].*(wait_healthy|wait_cmd)' deploy.sh; then
            echo "::error::deploy.sh must not wait for health; that work belongs in configure.sh"
            exit 1
          fi
          printf 'deploy.sh has no health wait\n'
      # deploy/services.toml is the single declaration of the public surface
      # (hostnames, MCP prefixes and ports, proxy hosts, onion services); the
      # first command validates the file itself. The two Markdown tables that
      # repeat it -- README's "What runs" and AGENTS.md's interface tables -- are
      # rendered from the declaration and the units, and the second command is
      # the only gate left that has to notice a stale one.
      - name: service manifest and generated docs
        run: |
          PYTHONPATH=scripts python3 -m stackctl manifest check deploy/services.toml
          ./scripts/docs-render.sh --check
      # load_manifest runs this package on the bare interpreter (install.sh,
      # verify.sh, monitor.sh, CI itself), so every command in it must stay
      # stdlib-only -- importing them proves it without a venv.
      - name: stackctl imports without extras
        run: PYTHONPATH=scripts python3 -c 'import stackctl.docs, stackctl.manifest, stackctl.npm, stackctl.units'
      # The Python core behind the npm-hosts reconciler (scripts/stackctl/),
      # offline: declaration parsing, payload construction, a full reconcile
      # against a fake NPM admin API. The shell's Go-duration parser
      # (deploy/root/status.sh, shared by both tiers) is pinned against
      # tests/fixtures/durations.txt by the shell-helper steps below.
      - name: stackctl python tests
        run: python3 tests/test_stackctl.py
      - name: shared shell helper tests
        run: tests/test-lib.sh
      # deploy/root/bouncer.sh shares the parser (status.sh, installed beside it)
      # but not the rounding: this pins the nft timeout clamp and the --dry-run
      # guard that must not replace the live verdict.
      - name: bouncer duration parser tests
        run: tests/test-bouncer.sh
      # The guard that decides whether a ban is enforced (ipguard.py, installed
      # beside the bouncer): every private boundary must skip, and the public
      # space immediately outside it must ban.
      - name: bouncer address guard tests
        run: python3 tests/test-ipguard.py
      # The status file scripts/monitor.sh reads has one writer,
      # deploy/root/status.sh: root sources it as /etc/stack-ids/status.sh,
      # scripts/lib.sh sources it from the checkout. This pins the contract and
      # that lib.sh has not grown a copy back.
      - name: status writer tests
        run: tests/test-status.sh
      # ... and one reader. A job that writes status_write directly skips the
      # dry-run rule and the unrecorded-verdict rule; a sweep that reads
      # result=fail itself re-decides the branch order that let the six jobs
      # drift apart. Both belong to status.sh/lib.sh now.
      - name: verdict protocol has one implementation
        run: |
          bad=$(grep -n 'status_write "\$' scripts/*.sh deploy/root/*.sh 2>/dev/null \
                    | grep -v '^deploy/root/status.sh:' || true)
          bad+=$(grep -n 'STATUS_RESULT" = fail' scripts/monitor.sh verify.sh 2>/dev/null || true)
          if [ -n "$bad" ]; then
              printf '%s\n' "$bad" >&2
              echo 'call verdict_write / verdict_judge from deploy/root/status.sh and scripts/lib.sh instead' >&2
              exit 1
          fi
