name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # The runner's shellcheck is older and disagrees on some checks (SC2015
      # among them), so a lint that passes locally can fail here for no reason.
      # Pin the version the developer tools carry (see the shellcheck line in
      # AGENTS.md); bump both together.
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v7
      # -P SCRIPTDIR makes the `# shellcheck source=…` directives resolve
      # relative to each script, and -S info gates on every finding. The file
      # list is enumerated from git rather than written out: a hardcoded list
      # silently skipped four scripts (deploy/btcpay/monero-notify.sh,
      # deploy/root/{audit-report.sh,suricata/start.sh}, scripts/btcpay-wallet.sh)
      # and both scripts/logs.sh and scripts/metrics.sh were missing from one
      # step or the other.
      - name: shellcheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" --version
          mapfile -t files < <(git ls-files '*.sh')
          printf 'shellcheck: %d scripts\n' "${#files[@]}"
          "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" -x -P SCRIPTDIR -S info \
            "${files[@]}"
      # The healthcheck contract (AGENTS.md): explicit keys, a bounded probe,
      # systemd owning the restart. Reads deploy/ templates, so it needs no host.
      - name: healthcheck contract
        run: ./scripts/healthcheck-lint.sh
      # A container unit may mount only from $DATA_DIR (or a podman volume), never
      # from the checkout. Host scripts still run from the checkout (deploy/*.service
      # is the tooling), but a container a daemon starts fails at its *next* start
      # on a moved or deleted repo, with podman naming a missing bind source nobody
      # edited -- which is what monerod's --block-notify helper and the BTCPay
      # bootstrap script used to do. install.sh stages those two into $DATA_DIR/bin;
      # this keeps the next one from sneaking in.
      - name: container units never mount the checkout
        run: |
          mapfile -t files < <(git ls-files 'deploy/*.container' 'deploy/*.container.in' 'deploy/root/*.container')
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no container templates found"; exit 1; }
          if hits=$(grep -n '@REPO_DIR@' "${files[@]}"); then
            echo "::error::a container unit references @REPO_DIR@ -- install.sh must stage it under \$DATA_DIR:"
            printf '%s\n' "$hits"
            exit 1
          fi
          printf 'no container template references @REPO_DIR@\n'
      # deploy/install.sh seeds monitor.env from the example, so the file a fresh
      # host gets and the documentation cannot drift. This catches the other
      # direction: a key scripts/monitor.sh starts reading that the example never
      # documents (five of them were in that state), which leaves a fresh host
      # unable to discover or tune it from the file its own installer wrote.
      - name: monitor.env documents every key the sweep reads
        run: |
          read_keys=$(grep -oE 'env_value "\$MONITOR_ENV" MONITOR_[A-Z_]+' scripts/monitor.sh \
            | awk '{print $NF}' | sort -u)
          declared=$(grep -oE '^MONITOR_[A-Z_]+=' deploy/examples/monitoring/monitor.env.example \
            | tr -d '=' | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$read_keys") <(printf '%s\n' "$declared"))
          if [ -n "$missing" ]; then
            echo "::error::deploy/examples/monitoring/monitor.env.example does not document: $(echo "$missing")"
            exit 1
          fi
          printf 'all %s monitor.env keys documented\n' "$(printf '%s\n' "$read_keys" | wc -l)"
      # The applied-unit baseline (scripts/lib.sh) is what makes a hand render
      # visible drift instead of a swallowed restart signal. The helpers are pure
      # file work, so the contract is testable without podman or a host: a
      # round-trip, no drift on an unchanged tree, exactly the touched unit on a
      # changed one, and the one-time adoption when no baseline exists.
      - name: unit digest manifest
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/q" "$tmp/d"
          printf 'one\n' > "$tmp/q/a.container"
          printf 'two\n' > "$tmp/q/b.container"
          export QUADLET_DIR="$tmp/q" DATA_DIR="$tmp/d"
          # shellcheck source=scripts/lib.sh
          . scripts/lib.sh
          before=$(unit_digest)
          unit_digest_write "$DATA_DIR/audit/units.applied" "$before"
          [ "$(unit_applied_read)" = "$before" ] \
            || { echo "::error::manifest round-trip failed"; exit 1; }
          [ -z "$(unit_digest_changed "$before" "$(unit_digest)")" ] \
            || { echo "::error::an unchanged tree reported drift"; exit 1; }
          printf 'changed\n' > "$tmp/q/b.container"
          changed=$(unit_digest_changed "$before" "$(unit_digest)")
          [ "$changed" = b ] \
            || { echo "::error::expected unit b, got '$changed'"; exit 1; }
          rm -f "$DATA_DIR/audit/units.applied"
          [ "$(units_baseline 2>/dev/null)" = "$(unit_digest)" ] \
            || { echo "::error::a missing baseline was not adopted"; exit 1; }
          printf 'unit digest manifest ok\n'
      - name: syntax check
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          for f in "${files[@]}"; do
            bash -n "$f"
          done
