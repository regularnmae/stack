# Order the distro's audit-rules.service after the stack's data mount.
#
# The data dir is a `nofail` mount, so systemd does not order data.mount before
# local-fs.target; audit-rules.service waits only for that target and can run
# first. augenrules then aborts at the first watch under @DATA_DIR@ (ENOENT),
# leaving the rest of the ruleset unloaded and stack-audit paging a false
# shortfall. WantsMountsFor, not RequiresMountsFor: a missing data disk must not
# stop the host-level watches from loading.
[Unit]
WantsMountsFor=@DATA_DIR@
