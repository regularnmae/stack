# Replace the distro's augenrules invocation with the duplicate-tolerant
# wrapper. Keep 10-stack-data.conf: it owns the ordering after the data mount,
# which is the other reason this unit used to fail (docs/ids.md).
#
# ExecStart= with no value clears the packaged command before the new one;
# without it systemd would append a second ExecStart instead of replacing it.
[Service]
ExecStart=
ExecStart=/etc/stack-ids/audit-rules-load.sh
