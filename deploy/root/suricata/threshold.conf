# Suricata threshold.conf for this stack.
#
# Deliberately empty of rules. Suppression is a last resort, and every entry
# here is a detection this host no longer performs -- so it is written down
# explicitly, with a reason, or not at all.
#
# Syntax (threshold.conf(5), the file Suricata reads via `threshold-file:` in
# suricata.yaml):
#
#   suppress gen_id 1, sig_id 2010935                      # one signature
#   event_filter gen_id 1, sig_id 2221000, type limit, \
#       track by_src, count 5, seconds 60                  # rate-limit
#   rate_filter gen_id 1, sig_id 2100498, track by_src, \
#       count 20, seconds 60, new_action drop, timeout 300 # (IPS only; this
#                                                          # host is IDS-only)
#
# Note that `suppress` for a sid that is not loaded logs a startup warning, so
# an entry added here must name a rule that exists in the current ruleset (ET
# sids move; local.rules sids 9000xxx do not).
#
# Nothing in local.rules is ever suppressed: those rules describe this
# deployment, and a stack-specific alert firing during normal operation is a
# bug to fix, not traffic to hide.
