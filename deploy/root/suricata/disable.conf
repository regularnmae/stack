# Rules disabled from the ET Open set, passed to suricata-update by start.sh
# (--disable-conf).
#
# ONE entry, and it is the whole ET TOR family: this host runs a tor *client* on
# purpose (the onion services are a documented feature), so rules like "Known Tor
# Relay/Router (Not Exit) Node Traffic" fire on every relay connection tor makes
# -- a handful per minute, forever, on entirely legitimate traffic. Left in, they
# bury the inbound reputation alerts that are actually earning their keep (ET's
# DROP/CINS/COMPROMISED families flagged real Spamhaus-listed scanners hitting
# 80/443 within the first minutes of the sensor running).
#
# The filter is a message regex, not `group:`, because suricata-update's group
# matching does not resolve ET's rule-file groups here (all three spellings --
# `group:emerging-tor`, `group:emerging-tor.rules`, `sid:` -- dropped nothing,
# while `re:` demonstrably works). Disabled rules are written commented out, so
# the previous ruleset is still inspectable.
#
# Syntax: one `sid:N`, `re:regex` or `group:name` per line. If ET renames the
# family, `suricata-update` logs "enabled:" unchanged and the alerts come back --
# check `grep -c '^alert.*ET TOR' /var/lib/suricata/rules/suricata.rules` after a
# rules update.
re:ET TOR
