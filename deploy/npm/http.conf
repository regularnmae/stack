# Rate-limit zones for the stack's proxy hosts.
#
# Installed to $DATA_DIR/npm/data/nginx/custom/http.conf by deploy/install.sh.
# nginx-proxy-manager includes that file inside http {} and never regenerates the
# custom/ directory, so it is the one place a stack-owned directive can live
# without fighting the reconciler (the proxy_host/*.conf files are generated from
# NPM's database and are rewritten on every scripts/npm-hosts.sh run).
#
# The limit_req/limit_conn directives themselves live per host, in the
# advanced_config field scripts/npm-hosts.sh sends -- because which limit applies
# depends on what the vhost is, and one of them must not exist at all.
#
# Two zones, because attribution differs by ingress:
#
#   stack_ip    keyed on the client address. Correct on the clearweb vhosts,
#               where NPM sees the real address (it runs on the host network, so
#               no proxy protocol trickery is involved).
#
#   stack_onion keyed on $server_name, NOT the address. The .onion proxies are
#               reached through tor, which forwards to host.containers.internal:
#               every onion visitor arrives as the HOST'S OWN address. A per-IP
#               limit there would be a single global bucket shared by everyone
#               (and indistinguishable from the host itself), so it is keyed
#               explicitly as a global brake: 60 r/s across all onion traffic,
#               with a burst of 120, which is far above this site's real usage
#               and far below a flood.
#
# 30 r/s per client with burst 60 is generous for a browser session (a page load
# plus its assets) and still stops a wordlist walk: the scanner found in this
# host's logs made 1,900 requests in about 12 seconds, i.e. ~150 r/s.
limit_req_zone $binary_remote_addr zone=stack_ip:10m rate=30r/s;
limit_req_zone $server_name zone=stack_onion:1m rate=60r/s;

# Concurrent connections per client. This is the directive that belongs on a
# streaming endpoint: limit_req counts *requests*, and an SSE stream is one
# request that lasts an hour, so limiting it by rate would either do nothing or
# cut healthy clients.
limit_conn_zone $binary_remote_addr zone=stack_conn:10m;

# NPM writes its own resolver/log settings above this point; nothing here
# overrides them.
