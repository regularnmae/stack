# Request flooding: one client asking for far more than a browser or a bot's
# polite crawl ever does.
#
# This is the rule that protects the *availability* of the one public box, not
# its confidentiality -- the vhosts are TLS-terminated by nginx and the app is
# behind a queue. The capacity is deliberately huge (300 requests in 10 s, i.e.
# 30/s sustained) because anything tighter collides with:
#   * uptime-kuma (one request/min per declared monitor -- ~0.13/s with
#     today's list, whitelisted anyway),
#   * a page's asset load (one index.html plus its bundles),
#   * searxng's own image fetches.
# A client that trips this is a flood, a scrape or a very broken loop, and the
# profile's 4 h decision (`blackhole` is only the re-trigger cooldown) is
# proportionate.
type: leaky
name: stack/http-flood
description: "one client flooding the public vhosts"
filter: "evt.Meta.log_type == 'npm_access'"
groupby: evt.Meta.source_ip
capacity: 300
leakspeed: 10s
blackhole: 10m
labels:
  service: npm
  type: flood
  remediation: true
  confidence: 2
