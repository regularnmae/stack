# podman's event log, installed by deploy/install.sh into
# ~/.config/containers/containers.conf.d (the login user) and
# /etc/containers/containers.conf.d (the root tier). The reasoning is
# docs/logs.md, "podman's own event log is a config value".
#
# A drop-in rather than an edit of containers.conf: podman merges
# containers.conf.d/*.conf after the main file, so an operator's own file is
# never rewritten. To put events back on journald, add a later-sorting
# drop-in (for example 99z-journald.conf) -- scripts/monitor.sh then warns.
[engine]
events_logger = "file"
events_logfile_max_size = "10m"
